; CH32V003Haptics — MAX4466 3-band FFT → bidirectional H-bridge haptics
; Board: TENSTAR CH32V003F4P6 (generic TSSOP-20 module)
; Probe: WCH-LinkE (1-wire SWIO on PD1)

[env:genericCH32V003F4P6]
platform = ch32v
board = genericCH32V003F4P6
framework = ch32v003fun
upload_protocol = wch-link
monitor_speed = 115200

; Optional: use CNLohr minichlink instead of OpenOCD
;upload_protocol = minichlink

; Optional: use the Rust wlink tool
;upload_protocol = wlink
