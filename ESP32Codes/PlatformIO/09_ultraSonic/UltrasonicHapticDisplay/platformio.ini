[env:pico]
platform = raspberrypi
board = pico
framework = arduino
monitor_speed = 115200
; BENCH_TEST=1 is the default in src/Config.h (continuous carrier, 25-50% duty).
; Uncomment to restore conservative 1-20% duty + AM envelope:
; build_flags = -DBENCH_TEST=0
lib_deps = 
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5
