[env:esp32dev]
platform = espressif32@6.6.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 115200

build_flags =
  -Os
  -DCORE_DEBUG_LEVEL=1
  ; Display Settings (CYD ESP32-2432S028R ILI9341 2.8")
  -DUSER_SETUP_LOADED=1
  -DILI9341_2_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DETFT_BL_ON=HIGH
  -DSPI_FREQUENCY=55000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000
  -DTOUCH_CS=33
  -DLOAD_GLCD
  -DLOAD_FONT2
  -DLOAD_FONT4
  -DLOAD_GFXFF
  ; NimBLE tuning
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

lib_deps =
  bodmer/TFT_eSPI @ ^2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
  h2zero/NimBLE-Arduino @ ^1.4.2
  bblanchon/ArduinoJson @ ^7.0.0
