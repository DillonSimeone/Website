[env:esp32c3]
platform = espressif32@6.6.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; Enable USB CDC for native Serial over Type-C
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps = 
    fastled/FastLED@3.6.0
    acrandal/RevEng PAJ7620@^1.5.0
