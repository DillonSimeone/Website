[env:esp32c3]
platform        = espressif32@6.6.0
board           = esp32-c3-devkitm-1
framework       = arduino
monitor_speed   = 115200
upload_speed    = 921600
; Auto-detect COM port by default (uncomment to pin a specific port):
; upload_port   = COM24
; monitor_port  = COM24


; Use the on-board USB-CDC for both upload and serial.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_USE_WDT=0
    -O2
    -fno-math-errno

lib_deps =
    fastled/FastLED@3.6.0
    esphome/ESPAsyncWebServer-esphome @ ^3.1.0
    bblanchon/ArduinoJson @ ^7.0.0
    kosme/arduinoFFT @ ^2.0.2

board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
extra_scripts = pre:sync_webui.py

[env:audio]
extends         = env:esp32c3
build_flags =
    ${env:esp32c3.build_flags}
    -DEMBER_AUDIO=1
