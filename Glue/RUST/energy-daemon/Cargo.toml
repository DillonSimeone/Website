[package]
name = "energy-daemon"
version = "0.1.0"
edition = "2021"
authors = ["Glue RUST Team"]
description = "High-performance native Windows daemon managing Pixel Eco-Tether profile"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Console",
    "Win32_Security",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
