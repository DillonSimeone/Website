<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integer Statistics</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Integer Statistics Calculator</h1>
        
        <div class="input-group">
            <label for="numberInput">Enter an integer:</label>
            <input type="number" id="numberInput" placeholder="e.g., 42">
            <button id="addNumberButton">Add Number</button>
        </div>

        <div class="numbers-display">
            <h2>Numbers Entered:</h2>
            <p id="numbersList">None yet.</p>
        </div>

        <button id="calculateButton">Calculate Statistics</button>

        <div class="results-container">
            <h2>Results</h2>
            <p id="sumOutput">Sum: -</p>
            <p id="averageOutput">Average: -</p>
            <p id="minOutput">Minimum: -</p>
            <p id="maxOutput">Maximum: -</p>
        </div>
    </div>
    
    <script src="scripts.js"></script>
</body>
</html>
