<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Countdown</title>

  <!-- Link to Bootstrap stylesheet for simple layout and styling -->
  <!-- This setup aligns with Chapter 4 discussions on external stylesheets -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Main layout container -->
  <!-- Using Bootstrap's container and grid system to organize layout -->
  <main class="container py-5">

    <!-- Header section with the app title -->
    <header class="text-center mb-4">
      <h1>Birthday Countdown</h1>
    </header>

    <!-- Main form and countdown card section -->
    <section class="row justify-content-center">
      <article class="col-md-6">

        <!-- Form used to collect the user's birthday -->
        <!-- This aligns with Chapter 5's coverage on forms and input handling -->
        <form id="birthday-form" class="mb-4">
          <fieldset class="mb-3">
            <label for="birthday-input" class="form-label">Enter your Birthday:</label>
            <input type="date" id="birthday-input" class="form-control">
          </fieldset>
          <div class="text-center">
            <button type="submit" id="start-countdown" class="btn btn-primary">Start Countdown</button>
          </div>
        </form>

        <!-- Countdown display section (hidden by default) -->
        <!-- This area is shown after the user submits a valid date -->
        <!-- DOM manipulation of visibility is discussed in Chapter 6 -->
        <section id="countdown-display" class="card text-center d-none">
          <div class="card-body">
            <h2 class="card-title">Time Until Your Next Birthday:</h2>
            <p class="card-text display-6">
              <span id="days">--</span> days<br>
              <span id="hours">--</span> hours<br>
              <span id="minutes">--</span> minutes<br>
              <span id="seconds">--</span> seconds
            </p>
          </div>
        </section>

      </article>
    </section>

  </main>

  <!-- Link to JavaScript file written by the student -->
  <!-- Script should be placed at the end of the body to ensure the DOM is fully loaded -->
  <!-- This technique is reinforced throughout the examples in Chapter 8 -->
  <script src="countdown.js"></script>
</body>
</html>
