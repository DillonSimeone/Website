<!DOCTYPE html>
<html>
<head>
    <title>Bio Form</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <h1>Bio Form</h1>

    <p>Enter your full name:</p>
    <input type="text" id="full_name" value="enter first and last name here">

    <p>Enter your birthdate (mm-dd-yyyy):</p>
    <input type="text" id="dob" value="mm-dd-yyyy">

    <p>Enter your favorite colors (comma-separated):</p>
    <input type="text" id="colors" value="color, color, color">

    <button id="submit_button">Submit</button>

    <p id="message"></p>

    <script src="bio_form.js"></script>
</body>
</html>
