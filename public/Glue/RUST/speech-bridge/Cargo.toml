[package]
name = "speech-bridge"
version = "0.2.0"
edition = "2021"
default-run = "speech-bridge"

[lib]
name = "speech_bridge"
path = "src/lib.rs"

[[bin]]
name = "speech-bridge"
path = "src/main.rs"

[[bin]]
name = "speech-bench"
path = "src/bin/speech_bench.rs"

[dependencies]
cpal = "0.15"
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_SpeechSynthesis",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
