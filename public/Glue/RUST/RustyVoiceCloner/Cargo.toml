[package]
name = "rusty-voice-cloner"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "RustyVoiceCloner"
path = "src/main.rs"

[dependencies]
cpal = "0.15"
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui_plot = "0.29"
hound = "3.5"
rustfft = "6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
