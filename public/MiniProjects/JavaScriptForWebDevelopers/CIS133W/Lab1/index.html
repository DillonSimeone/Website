<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shrek Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="calculator-container">
        <h1>The Swamp Juice Master Brewer</h1>
        <p>Shrek is brewing a fresh batch of swamp juice to keep unwanted visitors away.</p>
        <div class="input-group">
            <label for="mudInput">Pounds of Mud:</label>
            <input type="text" id="mudInput">
        </div>

        <div class="input-group">
            <label for="onionsInput">Pounds of Onions:</label>
            <input type="text" id="onionsInput">
        </div>

        <div class="input-group">
            <label for="slugInput">Pounds of Slug Mucus:</label>
            <input type="text" id="slugInput">
        </div>

        <div class="input-group">
            <label for="snailInput">Pounds of Snail Slime:</label>
            <input type="text" id="snailInput">
        </div>

        <button id="calculateButton">Get Swamp Juice</button>

        <div class="results-container">
            <h2>Results</h2>
            <p>Total Swamp Juice: <span id="juiceAmount">0.00</span></p>
            <p>Stink Level <span id="stinkLevel">0.00</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
