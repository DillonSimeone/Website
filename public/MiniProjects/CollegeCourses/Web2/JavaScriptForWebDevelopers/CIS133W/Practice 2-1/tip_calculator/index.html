<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculator-container">
        <h1>Tip Calculator</h1>
        
        <div class="input-group">
            <label for="mealCostInput">Meal Cost ($):</label>
            <input type="number" id="mealCostInput" placeholder="0.00">
        </div>

        <div class="input-group">
            <label for="tipPercentInput">Tip Percent (%):</label>
            <input type="number" id="tipPercentInput" placeholder="15">
        </div>

        <button id="calculateButton">Calculate</button>

        <div class="results-container">
            <h2>Results</h2>
            <p>Tip Amount: <span id="tipAmountOutput">$0.00</span></p>
            <p>Total Cost: <span id="totalCostOutput">$0.00</span></p>
        </div>
    </div>

    <script src="calculator.js"></script>
</body>
</html>
