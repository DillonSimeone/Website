<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pig Latin Translator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <h1>Pig Latin Translator</h1>
            <p>Enter a sentence below to see it translated into Pig Latin.</p>
            
            <div class="input-section">
                <input type="text" id="userInput" placeholder="Enter text here..." class="text-input" />
                <button id="translateButton" class="translate-button">
                    Translate
                </button>
            </div>
    
            <div class="results-section">
                <h2>Translation:</h2>
                <p id="pigLatinOutput" class="output-text"></p>
            </div>
        </div>
    </div>

    <script src="translator.js"></script>
</body>
</html>
