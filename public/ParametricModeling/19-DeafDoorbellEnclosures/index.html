<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>19 — DeafDoorbell Master & Follower Enclosures (Parametric CAD)</title>
    <meta name="description" content="Precision top-loading 3D enclosures for DeafDoorbell Master and Follower nodes with zero-wiggle USB-C cable clamp, exposed tactile buttons, visible drywall screw mounting tabs, 3M Command adhesive recesses, and stable desktop kickstand.">

    <!-- Browser Import Map for Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.147.0/examples/jsm/"
        }
    }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="title-wrap">
            <span class="cad-badge">CAD-19</span>
            <h1>DEAFDOORBELL ENCLOSURE STUDIO v2.0</h1>
        </div>
        <div class="status-badge" id="kernel-status-badge">
            <div class="status-dot"></div>
            <span>KERNEL: <span id="kernel-status">INITIALIZING...</span></span>
        </div>
    </header>

    <main>
        <div id="viewport-container"></div>

        <aside class="sidebar">
            <!-- Section 1: Presets -->
            <div class="sidebar-section">
                <div class="section-title">1. Hardware Node Preset</div>
                <div class="preset-grid">
                    <button class="preset-btn active" data-preset="follower_all">Follower Complete</button>
                    <button class="preset-btn" data-preset="follower_petg">Follower PETG Cover</button>
                    <button class="preset-btn" data-preset="follower_base">Follower Base</button>
                    <button class="preset-btn" data-preset="follower_lid">Follower Mini Lid</button>
                    <button class="preset-btn" data-preset="follower_grid">Diffuser 8x8 Grid</button>
                    <button class="preset-btn" data-preset="follower_stand">Desktop Stand</button>
                    <button class="preset-btn" data-preset="master_all">Master Complete</button>
                    <button class="preset-btn" data-preset="master_base">Master Base</button>
                    <button class="preset-btn" data-preset="master_lid">Master Lid</button>
                    <button class="preset-btn" data-preset="all_plate" style="border-color: #00ff88; color: #00ff88;">Full Build Plate</button>
                </div>
            </div>

            <!-- Section 2: Mechanical Parameters -->
            <div class="sidebar-section">
                <div class="section-title">2. Tolerances &amp; Clamping</div>

                <div class="control-row">
                    <div class="control-label">
                        <span>Wall Thickness</span>
                        <span class="control-val"><span id="val-wallThickness">2.20</span> mm</span>
                    </div>
                    <input type="range" id="input-wallThickness" min="1.6" max="3.5" step="0.1" value="2.2">
                </div>

                <div class="control-row">
                    <div class="control-label">
                        <span>3D Print XY Fit Clearance</span>
                        <span class="control-val"><span id="val-printClearance">0.35</span> mm</span>
                    </div>
                    <input type="range" id="input-printClearance" min="0.15" max="0.6" step="0.05" value="0.35">
                </div>

                <div class="control-row">
                    <div class="control-label">
                        <span>Cable Strain Relief Clamping Dia</span>
                        <span class="control-val"><span id="val-cableJacketDia">4.00</span> mm</span>
                    </div>
                    <input type="range" id="input-cableJacketDia" min="3.2" max="5.0" step="0.1" value="4.0">
                </div>

                <div class="control-row">
                    <div class="control-label">
                        <span>Lid Screw Pilot Dia</span>
                        <span class="control-val"><span id="val-screwHoleDia">3.20</span> mm</span>
                    </div>
                    <input type="range" id="input-screwHoleDia" min="2.5" max="4.2" step="0.1" value="3.2">
                </div>

                <div class="control-row">
                    <div class="control-label">
                        <span>Exploded View Separation</span>
                        <span class="control-val"><span id="val-explodedView">0.00</span></span>
                    </div>
                    <input type="range" id="input-explodedView" min="0.0" max="1.0" step="0.02" value="0.0">
                </div>

                <label class="checkbox-row">
                    <input type="checkbox" id="check-wireframe">
                    <span>Show Wireframe Mesh Topology</span>
                </label>
            </div>

            <!-- Section 3: Production STL Downloads -->
            <div class="sidebar-section">
                <div class="section-title">3. Export Production STLs</div>
                <div class="export-btn-group">
                    <button class="btn-export all" data-export="all_plate">
                        <span>⚡ Download All .STL (Single Plate)</span>
                        <span>&darr;</span>
                    </button>
                    <button class="btn-export pink" data-export="follower_base">
                        <span>Follower Base STL</span>
                        <span>&darr;</span>
                    </button>
                    <button class="btn-export pink" data-export="follower_petg">
                        <span>Follower PETG Full Cover STL</span>
                        <span>&darr;</span>
                    </button>
                    <button class="btn-export pink" data-export="follower_lid">
                        <span>Follower Mini Clamp Lid STL</span>
                        <span>&darr;</span>
                    </button>
                    <button class="btn-export" data-export="follower_grid">
                        <span>8x8 Diffuser Grid STL</span>
                        <span>&darr;</span>
                    </button>
                    <button class="btn-export pink" data-export="follower_stand">
                        <span>Follower Desk Stand STL</span>
                        <span>&darr;</span>
                    </button>
                    <button class="btn-export" data-export="master_base">
                        <span>Master Base STL</span>
                        <span>&darr;</span>
                    </button>
                    <button class="btn-export" data-export="master_lid">
                        <span>Master Clamp Lid STL</span>
                        <span>&darr;</span>
                    </button>
                </div>
            </div>
        </aside>
    </main>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
