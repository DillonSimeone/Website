; Haxel — PlatformIO project
; Modular feature profiles via build flags. Pick an env in the Web Uploader.
;
; Naming: <board><TRANSPORT>[FEATURE...]
;   c3WIFILED     = ESP32-C3 + WiFi + FastLED   (default)
;   c3WIFI        = ESP32-C3 + WiFi, minimal
;   c3WIFIAUDIOLED= ESP32-C3 + WiFi + Audio + LED
;   c3BLULED      = ESP32-C3 + BLE + FastLED
;   c3FULLOLED    = ESP32-C3 + WiFi + LED + Knobs + OLED (future hardware)

[platformio]
default_envs = c3WIFILED

; ---------- Shared base ----------
[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DCORE_DEBUG_LEVEL=2
    -DHAXEL_VERSION_STR=\"1.2.0-dev\"
    ; Feature defaults (envs override to 1 as needed)
    -DHAXEL_FEATURE_LED=0
    -DHAXEL_FEATURE_AUDIO=0
    -DHAXEL_FEATURE_KNOBS=0
    -DHAXEL_FEATURE_OLED=0
    -DHAXEL_FEATURE_MESH_MASTER=0
    -DHAXEL_FEATURE_MESH_FOLLOWER=0
lib_deps =
    bblanchon/ArduinoJson@^7.1.0

[wifi_libs]
lib_deps =
    ${env.lib_deps}
    https://github.com/ESP32Async/AsyncTCP.git
    https://github.com/ESP32Async/ESPAsyncWebServer.git

[led_libs]
lib_deps =
    fastled/FastLED@^3.7.0

[audio_libs]
lib_deps =
    kosme/arduinoFFT@^2.0.2

[oled_libs]
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit BusIO@^1.16.1

[c3_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DHAXEL_TARGET_C3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[s3_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DHAXEL_TARGET_S3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[classic_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
build_flags =
    ${env.build_flags}
    -DHAXEL_TARGET_CLASSIC

; ---------- ESP32-C3 profiles ----------

[env:c3WIFI]
extends = c3_common
build_flags =
    ${c3_common.build_flags}
    -DHAXEL_WIFI
lib_deps =
    ${wifi_libs.lib_deps}
build_src_filter =
    +<*>
    -<web/BleServer.cpp>
    -<mesh/>

[env:c3WIFILED]
extends = c3_common
build_flags =
    ${c3_common.build_flags}
    -DHAXEL_WIFI
    -DHAXEL_FEATURE_LED=1
lib_deps =
    ${wifi_libs.lib_deps}
    ${led_libs.lib_deps}
build_src_filter =
    +<*>
    -<web/BleServer.cpp>
    -<mesh/>

[env:c3WIFIAUDIOLED]
extends = c3_common
build_flags =
    ${c3_common.build_flags}
    -DHAXEL_WIFI
    -DHAXEL_FEATURE_LED=1
    -DHAXEL_FEATURE_AUDIO=1
lib_deps =
    ${wifi_libs.lib_deps}
    ${led_libs.lib_deps}
    ${audio_libs.lib_deps}
build_src_filter =
    +<*>
    -<web/BleServer.cpp>
    -<mesh/>

[env:c3BLULED]
extends = c3_common
build_flags =
    ${c3_common.build_flags}
    -DHAXEL_BLU
    -DHAXEL_FEATURE_LED=1
lib_deps =
    ${env.lib_deps}
    ${led_libs.lib_deps}
build_src_filter =
    +<*>
    -<web/WebServer.cpp>
    -<web/CaptivePortal.cpp>
    -<web/ApiHandlers.cpp>
    -<mesh/>

[env:c3FULLOLED]
extends = c3_common
build_flags =
    ${c3_common.build_flags}
    -DHAXEL_WIFI
    -DHAXEL_FEATURE_LED=1
    -DHAXEL_FEATURE_AUDIO=1
    -DHAXEL_FEATURE_KNOBS=1
    -DHAXEL_FEATURE_OLED=1
lib_deps =
    ${wifi_libs.lib_deps}
    ${led_libs.lib_deps}
    ${audio_libs.lib_deps}
    ${oled_libs.lib_deps}
build_src_filter =
    +<*>
    -<web/BleServer.cpp>
    -<mesh/>

; Command Mode: fixed Master SoftAP portal + ESP-NOW fleet leader
[env:c3WIFILED_MASTER]
extends = c3_common
build_flags =
    ${c3_common.build_flags}
    -DHAXEL_WIFI
    -DHAXEL_FEATURE_LED=1
    -DHAXEL_FEATURE_AUDIO=1
    -DHAXEL_FEATURE_MESH_MASTER=1
lib_deps =
    ${wifi_libs.lib_deps}
    ${led_libs.lib_deps}
    ${audio_libs.lib_deps}
build_src_filter =
    +<*>
    -<web/BleServer.cpp>
    -<mesh/MeshFollower.cpp>

; Command Mode: ESP-NOW follower (no SoftAP portal)
[env:c3WIFILED_FOLLOWER]
extends = c3_common
build_flags =
    ${c3_common.build_flags}
    -DHAXEL_FEATURE_LED=1
    -DHAXEL_FEATURE_MESH_FOLLOWER=1
lib_deps =
    ${env.lib_deps}
    ${led_libs.lib_deps}
build_src_filter =
    +<*>
    -<web/WebServer.cpp>
    -<web/CaptivePortal.cpp>
    -<web/ApiHandlers.cpp>
    -<web/BleServer.cpp>
    -<mesh/MeshMaster.cpp>

; ---------- ESP32-S3 profiles ----------

[env:s3WIFILED]
extends = s3_common
build_flags =
    ${s3_common.build_flags}
    -DHAXEL_WIFI
    -DHAXEL_FEATURE_LED=1
lib_deps =
    ${wifi_libs.lib_deps}
    ${led_libs.lib_deps}
build_src_filter =
    +<*>
    -<web/BleServer.cpp>
    -<mesh/>

[env:s3BLULED]
extends = s3_common
build_flags =
    ${s3_common.build_flags}
    -DHAXEL_BLU
    -DHAXEL_FEATURE_LED=1
lib_deps =
    ${env.lib_deps}
    ${led_libs.lib_deps}
build_src_filter =
    +<*>
    -<web/WebServer.cpp>
    -<web/CaptivePortal.cpp>
    -<web/ApiHandlers.cpp>
    -<mesh/>

; ---------- Classic ESP32 profiles ----------

[env:devWIFILED]
extends = classic_common
build_flags =
    ${classic_common.build_flags}
    -DHAXEL_WIFI
    -DHAXEL_FEATURE_LED=1
lib_deps =
    ${wifi_libs.lib_deps}
    ${led_libs.lib_deps}
build_src_filter =
    +<*>
    -<web/BleServer.cpp>
    -<mesh/>

[env:devBLULED]
extends = classic_common
build_flags =
    ${classic_common.build_flags}
    -DHAXEL_BLU
    -DHAXEL_FEATURE_LED=1
lib_deps =
    ${env.lib_deps}
    ${led_libs.lib_deps}
build_src_filter =
    +<*>
    -<web/WebServer.cpp>
    -<web/CaptivePortal.cpp>
    -<web/ApiHandlers.cpp>
    -<mesh/>

; ---------- Legacy aliases (uploader / old scripts) ----------

[env:esp32-c3-wifi]
extends = env:c3WIFILED

[env:esp32-c3-ble]
extends = env:c3BLULED

[env:esp32-s3-wifi]
extends = env:s3WIFILED

[env:esp32-s3-ble]
extends = env:s3BLULED

[env:esp32dev-wifi]
extends = env:devWIFILED

[env:esp32dev-ble]
extends = env:devBLULED

[env:native-test]
platform = native
build_flags = -std=gnu++17 -DHAXEL_HOST_TEST
test_framework = unity
