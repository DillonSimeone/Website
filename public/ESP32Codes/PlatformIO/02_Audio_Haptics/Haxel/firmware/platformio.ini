; Haxel — PlatformIO project
; Simple 2-mode profiles per controller: WiFi or Bluetooth (BLE).
; Both modes include FastLED support out of the box.
;
;   c3WIFI / c3BLU   = ESP32-C3 (default: c3WIFI)
;   c6WIFI / c6BLU   = ESP32-C6 (FireBeetle 2 Mini)
;   s3WIFI / s3BLU   = ESP32-S3
;   devWIFI / devBLU = Classic ESP32

[platformio]
default_envs = c3WIFI

; ---------- Shared base ----------
[env]
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DCORE_DEBUG_LEVEL=2
    -DHAXEL_VERSION_STR=\"1.2.0-dev\"
    -DHAXEL_FEATURE_LED=1
    -DHAXEL_FEATURE_AUDIO=0
    -DHAXEL_FEATURE_KNOBS=0
    -DHAXEL_FEATURE_OLED=0
    -DHAXEL_FEATURE_MESH_MASTER=0
    -DHAXEL_FEATURE_MESH_FOLLOWER=0
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    fastled/FastLED@3.6.0

[wifi_base]
build_flags =
    -DHAXEL_WIFI
lib_deps =
    ${env.lib_deps}
    https://github.com/ESP32Async/AsyncTCP.git
    https://github.com/ESP32Async/ESPAsyncWebServer.git
build_src_filter =
    +<*>
    -<web/BleServer.cpp>
    -<mesh/>

[blu_base]
build_flags =
    -DHAXEL_BLU
lib_deps =
    ${env.lib_deps}
build_src_filter =
    +<*>
    -<web/WebServer.cpp>
    -<web/CaptivePortal.cpp>
    -<web/ApiHandlers.cpp>
    -<mesh/>

; ---------- Board bases ----------
[c3_common]
platform = espressif32@6.6.0
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DHAXEL_TARGET_C3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[c6_common]
platform = espressif32@6.6.0
board = esp32-c6-devkitm-1
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
build_flags =
    ${env.build_flags}
    -DHAXEL_TARGET_C6
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DHAXEL_DEFAULT_STATUS_LED_PIN=8

[s3_common]
platform = espressif32@6.6.0
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DHAXEL_TARGET_S3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[classic_common]
platform = espressif32@6.6.0
board = esp32dev
build_flags =
    ${env.build_flags}
    -DHAXEL_TARGET_CLASSIC

; ---------- ESP32-C3 ----------
[env:c3WIFI]
extends = c3_common
build_flags =
    ${c3_common.build_flags}
    ${wifi_base.build_flags}
lib_deps = ${wifi_base.lib_deps}
build_src_filter = ${wifi_base.build_src_filter}

[env:c3BLU]
extends = c3_common
build_flags =
    ${c3_common.build_flags}
    ${blu_base.build_flags}
lib_deps = ${blu_base.lib_deps}
build_src_filter = ${blu_base.build_src_filter}

; ---------- ESP32-C6 ----------
[env:c6WIFI]
extends = c6_common
build_flags =
    ${c6_common.build_flags}
    ${wifi_base.build_flags}
lib_deps = ${wifi_base.lib_deps}
build_src_filter = ${wifi_base.build_src_filter}

[env:c6BLU]
extends = c6_common
build_flags =
    ${c6_common.build_flags}
    ${blu_base.build_flags}
lib_deps = ${blu_base.lib_deps}
build_src_filter = ${blu_base.build_src_filter}

; ---------- ESP32-S3 ----------
[env:s3WIFI]
extends = s3_common
build_flags =
    ${s3_common.build_flags}
    ${wifi_base.build_flags}
lib_deps = ${wifi_base.lib_deps}
build_src_filter = ${wifi_base.build_src_filter}

[env:s3BLU]
extends = s3_common
build_flags =
    ${s3_common.build_flags}
    ${blu_base.build_flags}
lib_deps = ${blu_base.lib_deps}
build_src_filter = ${blu_base.build_src_filter}

; ---------- Classic ESP32 ----------
[env:devWIFI]
extends = classic_common
build_flags =
    ${classic_common.build_flags}
    ${wifi_base.build_flags}
lib_deps = ${wifi_base.lib_deps}
build_src_filter = ${wifi_base.build_src_filter}

[env:devBLU]
extends = classic_common
build_flags =
    ${classic_common.build_flags}
    ${blu_base.build_flags}
lib_deps = ${blu_base.lib_deps}
build_src_filter = ${blu_base.build_src_filter}

; ---------- Host unit tests ----------
[env:native-test]
platform = native
build_flags = -std=gnu++17 -DHAXEL_HOST_TEST
test_framework = unity
