[env:esp32c3]
platform = espressif32@6.6.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = min_spiffs.csv
build_unflags = -std=gnu++11

; Enable USB CDC for Serial output over USB-C and include shared protocol header
build_flags = 
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I../shared

upload_speed = 460800
monitor_speed = 115200

[env:esp32c3-ota]
platform = espressif32@6.6.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = min_spiffs.csv
build_unflags = -std=gnu++11
build_flags = 
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I../shared
upload_protocol = espota
upload_port = deafdoorbell.local
upload_flags =
    --port=3232
