; PlatformIO Project Configuration for The Haptic Petting Zoo (Swamp Biome)
; Target: ESP32-C3 SuperMini
; Hardware: L298N Mini Motor Driver + 3x 5V Coin Vibration Motors

[env:esp32c3]
platform = espressif32@6.6.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
