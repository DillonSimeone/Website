name: Package Haxel Firmware Distribution

on:
  push:
    branches:
      - main
    paths:
      - 'public/ESP32Codes/PlatformIO/02_Audio_Haptics/Haxel/firmware/**'
      - 'public/Projects/Haxel/package-firmware.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install zip utility (if missing)
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Package Haxel Firmware Zip
        run: node public/Projects/Haxel/package-firmware.mjs

      - name: Commit and push if zip changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/Projects/Haxel/haxel-firmware.zip
          if git diff --staged --quiet; then
            echo "No changes in haxel-firmware.zip"
          else
            git commit -m "Auto-update haxel-firmware.zip distribution [skip ci]"
            git push
          fi
