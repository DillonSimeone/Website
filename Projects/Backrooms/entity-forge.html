<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BACKROOMS // ENTITY BONE FORGE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #07070b;
      color: #e6e0d4;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      user-select: none;
    }
    #view {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }
    .panel {
      position: fixed;
      background: rgba(10, 12, 16, 0.88);
      border: 1px solid rgba(0, 240, 255, 0.35);
      border-radius: 4px;
      padding: 14px;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.7);
    }
    #left-panel {
      top: 14px;
      left: 14px;
      width: 295px;
      max-height: calc(100vh - 28px);
      overflow-y: auto;
    }
    #right-panel {
      top: 14px;
      right: 14px;
      width: 300px;
      max-height: calc(100vh - 28px);
      overflow-y: auto;
    }
    h1 {
      font-size: 14px;
      letter-spacing: 2px;
      color: #00f0ff;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 11px;
      color: #8ea098;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .section-title {
      font-size: 11px;
      letter-spacing: 1.4px;
      color: #ffb000;
      margin: 12px 0 6px 0;
      border-bottom: 1px solid rgba(255, 176, 0, 0.25);
      padding-bottom: 3px;
    }
    .organ-btn {
      width: 100%;
      text-align: left;
      background: rgba(20, 24, 30, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #ddd;
      padding: 8px;
      margin-bottom: 6px;
      border-radius: 3px;
      cursor: pointer;
      font-family: inherit;
    }
    .organ-btn.active {
      border-color: #00f0ff;
      background: rgba(0, 240, 255, 0.14);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.25);
    }
    .organ-top {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: bold;
    }
    .organ-danger { color: #ff4a6e; }
    .organ-desc {
      font-size: 10px;
      color: #9aa8a0;
      margin-top: 3px;
    }
    label.ctrl {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin: 8px 0;
      gap: 8px;
    }
    input[type="text"] {
      width: 100%;
      padding: 7px 8px;
      background: #0c1015;
      border: 1px solid rgba(0, 240, 255, 0.35);
      color: #fff;
      font-family: inherit;
      font-size: 12px;
      border-radius: 3px;
      margin-bottom: 8px;
    }
    .btn-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .action-btn {
      flex: 1;
      padding: 8px;
      font-family: inherit;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(24, 28, 34, 0.95);
      color: #eee;
      cursor: pointer;
      border-radius: 3px;
    }
    .action-btn.primary {
      border-color: #39ff14;
      color: #39ff14;
      background: rgba(57, 255, 20, 0.12);
    }
    .action-btn.danger {
      border-color: #ff3344;
      color: #ff6677;
    }
    .stat-box {
      background: rgba(16, 18, 24, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 9px;
      border-radius: 3px;
      font-size: 12px;
      line-height: 1.6;
    }
    .layer-band {
      margin-top: 8px;
      padding: 8px;
      border-left: 3px solid #ffb000;
      background: rgba(255, 176, 0, 0.08);
      font-size: 11px;
      line-height: 1.5;
    }
    .saved-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      margin-top: 5px;
      background: rgba(20, 24, 30, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      font-size: 11px;
      cursor: pointer;
    }
    .saved-item:hover {
      border-color: #00f0ff;
    }
    #status-bar {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 12, 16, 0.9);
      border: 1px solid rgba(255, 176, 0, 0.4);
      padding: 7px 14px;
      font-size: 12px;
      color: #ffb000;
      border-radius: 3px;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="left-panel" class="panel">
    <h1>ENTITY BONE FORGE</h1>
    <div class="sub">Click any limb or thorax in 3D to graft parts along the surface normal. Drag to orbit, scroll to zoom.</div>

    <div class="section-title">ORGAN &amp; BONE PALETTE</div>
    <div id="palette-el"></div>

    <div class="section-title">GRAFTING CONTROLS</div>
    <label class="ctrl">
      <span>Part Scale: <strong id="scale-val">1.0x</strong></span>
      <input type="range" id="scale-slider" min="0.5" max="1.8" step="0.1" value="1.0" />
    </label>
    <label class="ctrl">
      <span>Mirror X Symmetry</span>
      <input type="checkbox" id="mirror-toggle" checked />
    </label>
    <label class="ctrl">
      <span>Live Gait Animation</span>
      <input type="checkbox" id="anim-toggle" />
    </label>

    <div class="btn-row">
      <button class="action-btn" id="undo-btn">UNDO PART</button>
      <button class="action-btn danger" id="reset-btn">RESET CORE</button>
    </div>
  </div>

  <div id="right-panel" class="panel">
    <h1>SPECIMEN TELEMETRY</h1>
    <input type="text" id="entity-name" value="Forged Stalker" placeholder="Entity Name..." />
    <label class="ctrl">
      <span>Milestone Boss Class</span>
      <input type="checkbox" id="boss-toggle" />
    </label>

    <div class="stat-box" id="stats-el"></div>
    <div class="layer-band" id="layer-band-el"></div>

    <div class="btn-row">
      <button class="action-btn primary" id="save-btn">SAVE TO ENTITIES/</button>
      <button class="action-btn" id="back-btn" onclick="window.location.href='./index.html'">PLAY GAME</button>
    </div>

    <div class="section-title">SAVED ENTITIES (entities/)</div>
    <div id="saved-list-el">Loading...</div>
  </div>

  <div id="status-bar">Ready — Select an organ and click on the Core Thorax to graft.</div>

  <script type="module" src="./src/entityForge.js"></script>
</body>
</html>
